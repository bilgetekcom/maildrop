name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v0.1.3)'
        required: true
        default: 'v0.1.3'

permissions:
  contents: write

jobs:
  verify:
    name: Verify tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          TAG="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

  build:
    name: Build ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: '*.exe'
          - os: macos-latest
            script: build:mac
            artifact: '*.dmg'
          - os: ubuntu-latest
            script: build:linux
            artifact: '*.AppImage'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build (${{ matrix.os }})
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: maildrop-${{ matrix.os }}
          path: release/**/${{ matrix.artifact }}
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    # Allow publish to run even if one platform failed, as long as at least one succeeded.
    if: ${{ always() && contains(needs.build.result, 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          _TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VER="${_TAG#v}"
          # Pull the section between "## [VER]" or "### vVER" headings until the next heading
          awk -v ver="$VER" '
            BEGIN { in_section=0 }
            /^## / && in_section { exit }
            /^### / && in_section && match($0, /^### v?[0-9]/) { exit }
            in_section { print }
            $0 ~ "^## \\[" ver "\\]" { in_section=1; next }
            $0 ~ "^### v?" ver "( |$)" { in_section=1; next }
          ' CHANGELOG.md > release-notes.txt || true
          if [ ! -s release-notes.txt ]; then
            echo "MailDrop v$VER — see commit history." > release-notes.txt
          fi
          {
            echo "body<<EOF"
            cat release-notes.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.blockmap
            artifacts/**/latest*.yml
          draft: false
          prerelease: false
          generate_release_notes: false
          body: ${{ steps.notes.outputs.body }}
